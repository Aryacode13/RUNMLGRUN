name: rmr_cms
description: Flutter app with Supabase and Strava OAuth integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.0.0
  
  # OAuth
  flutter_web_auth_2: ^4.1.0
  webview_flutter: ^4.4.2
  
  # Google Sign-In (native, tanpa redirect_uri)
  google_sign_in: ^6.2.1
  
  # HTTP
  http: ^1.1.0
  
  # State Management
  provider: ^6.1.1
  
  # UI
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  
  # Crypto for password hashing
  crypto: ^3.0.3
  
  # File picker for form uploads
  file_picker: ^8.0.0
  
  # Shared preferences for storing user session
  shared_preferences: ^2.2.2
  
  # URL launcher for opening external URLs
  url_launcher: ^6.2.2
  shimmer: ^3.0.0
  
  # Local notifications
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  
  # Firebase Cloud Messaging for push notifications
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - lib/assets/RMR_W.png

